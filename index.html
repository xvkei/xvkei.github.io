<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8e3d7" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="haya.exe — a small personal desktop holding a developer portfolio: featured projects, public GitHub repositories, resume and contact."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>haya.exe</title>
    <script>
      // apply the saved theme before anything paints (keep the key in sync with src/lib/theme.ts)
      (function () {
        try {
          var pref = localStorage.getItem('haya.theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = pref === 'linen' || pref === 'night' ? pref : dark ? 'night' : 'linen';
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'night' ? '#1b1d19' : '#e8e3d7');
        } catch (e) {
          /* storage blocked: the CSS falls back to linen */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:36rem;margin:3rem auto;padding:1.25rem 1.5rem;font-family:system-ui,sans-serif;line-height:1.5;color:#343830;background:#f8f5ec;border:1px solid #8f8a7e;">
        <p style="margin:0 0 .5rem;font-family:ui-monospace,monospace;font-size:.8rem;">README_first.txt</p>
        <p style="margin:0;">haya.exe is a small interactive desktop and needs JavaScript to run. Please enable JavaScript to browse the projects, resume and contact details.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
