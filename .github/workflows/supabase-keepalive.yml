name: keep supabase awake

on:
  schedule:
    - cron: '0 3 * * 1,4' # Mondays and Thursdays, 11:00 Manila time
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: read one guestbook row
        run: |
          curl --fail --silent --show-error \
            "https://dfjbuypqgtqlionlysst.supabase.co/rest/v1/guestbook?select=id&limit=1" \
            -H "apikey: sb_publishable_obuYSxNKhKBVuiCdD8NEWw_QH1lGO0i" > /dev/null